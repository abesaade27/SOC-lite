version: "3.8"

services:
  soc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-lite-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY:-CHANGE_ME_LONG_RANDOM_STRING_HERE}
      - DB_PATH=/data/soc_lite.db
      - HOST=0.0.0.0
      - PORT=8000
      - RETENTION_DAYS=14
      - WS_BATCH_MS=500
    volumes:
      - soc-data:/data

volumes:
  soc-data:
