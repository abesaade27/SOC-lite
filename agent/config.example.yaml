server_url: "http://127.0.0.1:8000"
api_key: "CHANGE_ME_LONG_RANDOM_STRING_HERE"
host_override: null            # default: socket.gethostname()
channels:
  - name: "Security"
    xpath: "*"
  - name: "System"
    xpath: "*[System[(EventID=7045 or EventID=104 or EventID=7036)]]"
  - name: "Microsoft-Windows-PowerShell/Operational"
    xpath: "*[System[(EventID=4104)]]"
  - name: "Microsoft-Windows-Sysmon/Operational"
    xpath: "*"
  - name: "Microsoft-Windows-Windows Defender/Operational"
    xpath: "*[System[(EventID=5001 or EventID=5010 or EventID=5012 or EventID=1116 or EventID=1117)]]"
security_event_allowlist: [4624, 4625, 4634, 4648, 4672, 4688, 4697, 4698, 4720, 4722, 4724, 4725, 4726, 4728, 4732, 4740, 4756, 1102]
batch_size: 100
flush_interval_seconds: 2
backfill_on_start: true        # read events newer than bookmark before subscribing
backfill_max_events: 5000      # on first run with no bookmark, only last N events
mode: "subscribe"              # subscribe | poll
poll_interval_seconds: 2
spool_dir: "./spool"
spool_max_mb: 200
bookmark_file: "./bookmarks.json"
tls_verify: true
log_level: "INFO"
