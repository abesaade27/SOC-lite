# SOC-Lite Rules Configuration & Thresholds

whitelist_service_task:
  vendor_paths:
    - "googleupdate.exe"
    - "msedgeupdate.exe"
    - "\\appdata\\local\\microsoft\\onedrive"
    - "\\appdata\\local\\microsoft\\teams"
    - "\\appdata\\local\\zoom"
  parent_processes:
    - "googleupdate.exe"
    - "msedgeupdate.exe"
  trusted_signers:
    - "Google LLC"
    - "Microsoft Corporation"
    - "Zoom Video Communications, Inc."

SOC-001:
  enabled: true
  threshold: 5
  window_seconds: 60
  cooldown_seconds: 300
  allow_ips: []

SOC-002:
  enabled: true
  prior_failures_threshold: 5
  window_seconds: 300
  cooldown_seconds: 300

SOC-003:
  enabled: true
  cooldown_seconds: 60
  known_admins: ["Administrator", "admin", "SYSTEM"]

